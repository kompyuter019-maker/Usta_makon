<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Usta Makon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F2F7;--grouped:#F2F2F7;--card:#FFFFFF;
  --ink:#000000;--muted:#8E8E93;
  --accent:#007AFF;--accent-soft:rgba(0,122,255,0.12);
  --green:#34C759;--green-soft:rgba(52,199,89,0.15);
  --red:#FF3B30;--red-soft:rgba(255,59,48,0.15);
  --orange:#FF9500;--yellow:#FF9500;--yellow-soft:rgba(255,149,0,0.15);--yellow-ink:#A05C00;
  --rose:#FF2D55;--rose-soft:rgba(255,45,85,0.15);
  --fill:rgba(120,120,128,0.12);--fill2:rgba(120,120,128,0.16);
  --line:rgba(60,60,67,0.12);--sep:rgba(60,60,67,0.29);
  --shadow:0 0.5px 2px rgba(0,0,0,0.06),0 1px 1px rgba(0,0,0,0.02);
  --tabbar:rgba(249,249,249,0.94);
  color-scheme: light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--grouped:#000000;--card:#1C1C1E;
    --ink:#FFFFFF;--muted:#8E8E93;
    --accent:#0A84FF;--accent-soft:rgba(10,132,255,0.18);
    --green:#30D158;--red:#FF453A;--orange:#FF9F0A;--yellow:#FFD60A;--yellow-soft:rgba(255,214,10,0.18);--yellow-ink:#FFD60A;
    --rose:#FF375F;--rose-soft:rgba(255,55,95,0.2);
    --fill:rgba(120,120,128,0.24);--fill2:rgba(120,120,128,0.32);
    --line:rgba(84,84,88,0.65);--sep:rgba(84,84,88,0.65);
    --shadow:none;
    --tabbar:rgba(28,28,30,0.94);
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--grouped:#000000;--card:#1C1C1E;
  --ink:#FFFFFF;--muted:#8E8E93;
  --accent:#0A84FF;--accent-soft:rgba(10,132,255,0.18);
  --green:#30D158;--red:#FF453A;--orange:#FF9F0A;--yellow:#FFD60A;--yellow-soft:rgba(255,214,10,0.18);--yellow-ink:#FFD60A;
  --rose:#FF375F;--rose-soft:rgba(255,55,95,0.2);
  --fill:rgba(120,120,128,0.24);--fill2:rgba(120,120,128,0.32);
  --line:rgba(84,84,88,0.65);--sep:rgba(84,84,88,0.65);
  --shadow:none;
  --tabbar:rgba(28,28,30,0.94);
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}

body{
  margin:0;background:var(--grouped);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* Kirish (onboarding) */
.hero{background:var(--grouped);padding:64px 0 20px}
.brand{font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;margin-bottom:26px;color:var(--ink)}
.logo{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--accent);border-radius:9px;font-size:18px;color:#fff}
.hero h1{margin:0;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-0.6px}
.hero p{margin:12px 0 0;max-width:36ch;color:var(--muted);font-size:17px}
.sheet{background:var(--grouped);padding:8px 0 48px}
.sheet h2{margin:0 0 14px;font-size:20px;font-weight:700;letter-spacing:-0.3px}
.role{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);color:var(--ink);transition:transform .12s ease}
.role:active{transform:scale(0.985);background:var(--fill)}
.role .ic{flex:none;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:22px}
.role b{display:block;font-size:17px;font-weight:600}
.role span{color:var(--muted);font-size:14px}

.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;font-size:16px}

label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px;color:var(--muted)}
input,select,textarea{
  width:100%;background:var(--fill);border:1.5px solid transparent;border-radius:10px;
  padding:12px 14px;font-size:16px;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.err{color:var(--red);font-size:14px;min-height:22px;margin:10px 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:600;font-size:16px;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:#fff;transition:opacity .12s,transform .12s}
.btn:active{opacity:.75;transform:scale(0.985)}
.btn.wide{width:100%}
.btn.alt{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1.5px solid var(--sep);color:var(--ink)}

/* Ilova */
.top{background:var(--grouped);padding:8px 0 4px}
.top h1{margin:0;font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-0.6px}
.top p{margin:4px 0 0;color:var(--muted);font-size:15px}

.finder{margin-top:14px;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.finder .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:0.5px solid var(--sep);border-radius:18px;padding:8px 14px;font-weight:500;font-size:14px;color:var(--ink);white-space:nowrap;transition:transform .1s}
.chip:active{transform:scale(0.95)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-female[aria-pressed=true]{background:var(--rose);border-color:var(--rose)}

.count{margin:16px 0 4px;color:var(--muted);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:0.4px}
.note{background:var(--green-soft);color:var(--green);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px;font-weight:600}

.list{display:flex;flex-direction:column;gap:10px;padding:12px 0 24px}
.row{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.head{display:flex;gap:12px;align-items:flex-start}
.mono{flex:none;width:48px;height:48px;border-radius:50%;color:#fff;font-weight:600;font-size:20px;display:grid;place-items:center;background:var(--accent)}
.who{flex:1;min-width:0}
.name{margin:0;font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-0.2px}
.job{margin:3px 0 0;color:var(--accent);font-weight:500;font-size:14px}
.rate{background:var(--yellow-soft);color:var(--yellow-ink);border-radius:8px;padding:3px 9px;font-weight:600;font-size:13px;white-space:nowrap;align-self:flex-start}
.rate.new{background:var(--green-soft);color:var(--green)}
.fav{flex:none;width:36px;height:36px;border-radius:50%;background:var(--fill);font-size:18px;line-height:1;color:var(--muted);display:grid;place-items:center;transition:transform .12s}
.fav:active{transform:scale(0.9)}
.fav[aria-pressed=true]{background:var(--yellow-soft);color:var(--yellow-ink)}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px;padding:10px 0;border-top:0.5px solid var(--sep);border-bottom:0.5px solid var(--sep)}
.facts div{font-size:14px;font-weight:600;text-align:center}
.facts small{display:block;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:2px}
.about{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.45}

.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:0;font-size:15px;padding:11px 12px}
.acts .btn.alt{flex:0.8}

.mine{background:var(--green-soft);color:var(--green);border-radius:10px;padding:10px;text-align:center;font-weight:600;font-size:14px}

.empty{text-align:center;color:var(--muted);padding:44px 12px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-weight:600}

.prof{padding:8px 0}
.prof dl{margin:0 0 18px;background:var(--card);border-radius:14px;padding:4px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr}
.prof dt{color:var(--muted);font-weight:500;padding:12px 0;border-bottom:0.5px solid var(--sep)}
.prof dd{margin:0;font-weight:500;padding:12px 0;text-align:right;border-bottom:0.5px solid var(--sep)}
.prof dl>:nth-last-child(-n+2){border-bottom:0}

main.pad{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:0.5px solid var(--sep);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;background:none;border:0;border-radius:10px;padding:6px 2px;font-weight:500;font-size:10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .12s}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--accent)}

.chead{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:0.5px solid var(--sep);margin-bottom:8px}
.chead small{display:block;color:var(--muted);font-size:13px}
.cnote{background:var(--yellow-soft);color:var(--yellow-ink);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px;font-weight:500}
.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 0 16px;max-height:52vh;overflow-y:auto}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;overflow-wrap:anywhere;font-size:15px}
.bub small{display:block;font-size:10px;opacity:.65;margin-top:3px}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.bub.he{align-self:flex-start;background:var(--fill2);border-bottom-left-radius:4px}
.cform{display:flex;gap:8px;margin-top:8px}
.cform .btn{flex:none}

.inb{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);color:var(--ink)}
.inb .mono{width:42px;height:42px;font-size:16px}
.inb span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.inb em{font-style:normal;color:var(--muted);font-size:11px;align-self:flex-start;margin-top:2px}
.inb .who{display:flex;flex-direction:column;min-width:0;gap:1px}
.inb b{font-weight:600;font-size:15px}

.badge{display:inline-block;border-radius:6px;padding:2px 7px;font-weight:600;font-size:11px;margin-left:6px;vertical-align:middle}
.badge.free{background:var(--green-soft);color:var(--green)}
.badge.busy{background:var(--red-soft);color:var(--red)}
.female-badge{display:inline-block;background:var(--rose-soft);color:var(--rose);font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}

.calc{margin:10px 0 0;background:var(--fill);border-radius:12px;padding:10px 12px}
.calc summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;padding:2px 0;list-style:none}
.calc summary::-webkit-details-marker{display:none}
.calc summary::after{content:"›";float:right;transform:rotate(90deg);transition:transform .15s;color:var(--muted)}
.calc[open] summary::after{transform:rotate(-90deg)}
.calc input{margin-top:8px;background:var(--card)}
.res{margin-top:8px;font-weight:600;font-size:14px;color:var(--green)}

.offer{background:var(--fill);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.offer b{display:block;font-weight:600}
.offer a{font-weight:600;display:inline-block;margin-top:4px}

.finder details[open] summary::after{transform:rotate(-90deg)}
#vOrders{margin-top:0}

/* Skeleton uchun kichik animatsiya */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.row,.inb,.role{animation:fadeIn .2s ease-out both}
</style>
</head>
<body>

<section id="auth" hidden>
  <div class="hero"><div class="wrap">
    <div class="brand"><span class="logo">🛠️</span>Usta Makon</div>
    <h1>Ishonchli usta,<br>yaqin joyda</h1>
    <p>Santexnika, elektrika, remont, tozalash va boshqa ustalarni topib, bevosita bogʻlaning.</p>
  </div></div>
  <div class="sheet"><div class="wrap">
    <div id="stepRole">
      <h2>Xush kelibsiz</h2>
      <button class="btn wide" type="button" id="goReg">Roʻyxatdan oʻtish</button>
      <button class="btn line wide" type="button" data-mode="kirish" style="margin-top:12px">Akkauntim bor, kirish</button>
    </div>
    <div id="stepPick" hidden>
      <button class="link" type="button" id="pickBack">‹ Orqaga</button>
      <h2>Kim sifatida roʻyxatdan oʻtasiz?</h2>
      <button class="role" type="button" data-mode="mijoz"><span class="ic">🔍</span><span><b>Men mijozman</b><span>Kerakli ustani qidiraman</span></span></button>
      <button class="role" type="button" data-mode="usta"><span class="ic">🛠️</span><span><b>Men ustaman</b><span>Mijozlar meni topsin</span></span></button>
    </div>
    <div id="stepForm" hidden>
      <button class="link" type="button" id="back">‹ Orqaga</button>
      <h2 id="formTitle"></h2>
      <div id="nameBox"><label for="fName">Ism</label><input id="fName" autocomplete="name"></div>
      <label for="fPhone">Telefon raqam</label>
      <input id="fPhone" type="tel" placeholder="+998 90 123 45 67" autocomplete="tel">
      <label for="fPass">Parol (kamida 6 belgi)</label>
      <input id="fPass" type="password" autocomplete="new-password">
      <div id="ustaBox">
        <label for="fJob">Kasb</label><select id="fJob"></select>
        <label for="fGender">Jinsi</label><select id="fGender"><option value="">Koʻrsatmaslik</option><option value="m">Erkak</option><option value="f">Ayol</option></select>
        <label for="fRegion">Hudud</label><select id="fRegion"></select>
        <label for="fTg">Telegram (ixtiyoriy)</label><input id="fTg" placeholder="@foydalanuvchi">
        <label for="fPrice">Narx (masalan: 100 000 soʻmdan)</label><input id="fPrice">
        <label for="fExp">Tajriba (yil)</label><input id="fExp" type="number" min="0" max="60">
        <label for="fAbout">Oʻzingiz haqingizda</label><textarea id="fAbout" rows="3"></textarea>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn wide" type="button" id="submit"></button>
    </div>
  </div></div>
</section>

<section id="app" hidden>
  <div class="top"><div class="wrap">
    <h1 id="title"></h1>
    <p id="hello"></p>
  </div></div>
  <main class="wrap pad">
    <div id="vHome">
      <div class="finder">
        <input id="q" type="search" placeholder="Ism yoki ish turi boʻyicha qidiring" aria-label="Qidiruv">
        <div class="two">
          <select id="region" aria-label="Hudud"></select>
          <select id="sort" aria-label="Saralash">
            <option value="rating">Reyting boʻyicha</option>
            <option value="exp">Tajriba boʻyicha</option>
            <option value="new">Yangilar oldin</option>
          </select>
        </div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Kasb"></div>
      <div class="note" id="note" hidden>Siz usta sifatida roʻyxatdan oʻtgansiz. Profilingiz mijozlarga koʻrinadi.</div>
    </div>
    <div id="vMe" hidden></div>
    <div id="vChat" hidden></div>
    <div id="vOrders" hidden></div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
  </main>
  <nav class="tabs" aria-label="Boʻlimlar">
    <button type="button" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-5v-7H10v7H5a2 2 0 0 1-2-2z"/></svg><span>Ustalar</span></button>
    <button type="button" data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Eʼlonlar</span></button>
    <button type="button" data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"/></svg><span>Xabarlar</span></button>
    <button type="button" data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg><span>Saqlangan</span></button>
    <button type="button" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profil</span></button>
  </nav>
</section>
