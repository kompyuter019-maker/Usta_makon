<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1a16">
<title>Usta Makon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1a16; --panel:#13261f; --line:#25443a; --text:#eaf3ee; --muted:#9bb5a9;
  --accent:#ffb703; --accent-ink:#1a1300; --blue:#4cc2ff; --err:#ff8a80;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Onest","Segoe UI",system-ui,sans-serif;font-size:1rem;line-height:1.55}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.screen{display:none;width:min(100% - 2rem,40rem);margin:0 auto;padding:2rem 0 3rem}
.screen.on{display:block}
h1{font-size:clamp(2rem,8vw,2.8rem);line-height:1.05;letter-spacing:-.03em;margin:0 0 .5rem;font-weight:800}
h2{font-size:1.5rem;margin:1.5rem 0 1rem;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 1.5rem}
.logo{color:var(--accent)}

/* Kirish */
.role{display:block;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;margin-bottom:.8rem;cursor:pointer}
.role:hover{border-color:var(--accent)}
.role b{display:block;font-size:1.15rem}
.role span{color:var(--muted)}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;padding:.5rem 0}

/* Forma */
label{display:block;font-weight:600;margin:1rem 0 .35rem}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:.75rem .9rem}
textarea{min-height:5.5rem;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted)}
select option{background:var(--panel)}
.only-master{display:none}
.master .only-master{display:block}
.err{color:var(--err);font-weight:600;min-height:1.5rem;margin:.8rem 0 0}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;font:inherit;font-weight:800;padding:.9rem 1.4rem;cursor:pointer;width:100%;margin-top:.6rem}
