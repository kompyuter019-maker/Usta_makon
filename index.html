<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To'liq Ilova - Auth Tizimi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: radial-gradient(circle at top right, #1e293b, #0f1219);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; overflow: hidden;
        }
        .card {
            background: rgba(26, 31, 43, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 32px; width: 100%; max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative; overflow: hidden; transition: all 0.3s ease;
        }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            border-radius: 18px; display: flex; justify-content: center; align-items: center;
            margin: 0 auto 16px; box-shadow: 0 8px 20px rgba(139,92,246,0.3);
        }
        .logo svg { width: 32px; height: 32px; fill: #fff; }
        h1 { color: #fff; text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; text-align: center; font-size: 14px; margin-bottom: 24px; }

        .tabs {
            display: flex; background-color: #0f1219; border-radius: 14px;
            padding: 6px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.05);
        }
        .tab {
            flex: 1; padding: 12px; border: none; background: none; color: #94a3b8;
            font-weight: 600; border-radius: 10px; cursor: pointer; font-size: 14px;
            transition: all 0.3s ease;
        }
        .tab.active {
            background: linear-gradient(90deg, #06b6d4, #8b5cf6);
            color: #fff; box-shadow: 0 4px 15px rgba(6,182,212,0.3);
        }
        .tab:not(.active):hover { color: #fff; background: rgba(255,255,255,0.05); }

        .form-group { margin-bottom: 18px; }
        label {
            display: block; color: #cbd5e1; font-size: 11px; font-weight: 700;
            margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-box > svg { position: absolute; left: 16px; width: 20px; height: 20px; fill: #64748b; transition: fill 0.3s; }
        input {
            width: 100%; background-color: #1e2432; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 14px 14px 14px 48px; color: #fff; font-size: 14px;
            outline: none; transition: all 0.3s ease;
        }
        input::placeholder { color: #64748b; }
        input:focus { border-color: #8b5cf6; background-color: #232a3b; box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
        .input-box:focus-within > svg { fill: #8b5cf6; }

        .toggle-pass { position: absolute; right: 16px; cursor: pointer; display: flex; opacity: 0.7; transition: opacity 0.3s; }
        .toggle-pass:hover { opacity: 1; }
        .toggle-pass svg { position: static; width: 20px; height: 20px; fill: #64748b; transition: fill 0.3s; }

        .submit-btn {
            width: 100%; background: linear-gradient(90deg, #06b6d4, #8b5cf6);
            color: white; border: none; border-radius: 14px; padding: 16px;
            font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px;
            transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(6,182,212,0.25);
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(139,92,246,0.4); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .divider { display: flex; align-items: center; color: #64748b; font-size: 13px; margin: 24px 0; gap: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

        .socials { display: flex; gap: 12px; }
        .social-btn {
            flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px;
            background-color: #1e2432; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 14px; color: #fff; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
        }
        .social-btn:hover { background-color: #2a3142; border-color: rgba(255,255,255,0.15); }
        .social-btn svg { width: 20px; height: 20px; }

        .toast {
            position: fixed; top: 20px; right: 20px; background: #1e2432;
            border: 1px solid #8b5cf6; color: #fff; padding: 14px 24px;
            border-radius: 12px; font-size: 14px; font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateX(150%); transition: transform 0.4s ease;
            z-index: 1000; display: flex; align-items: center; gap: 10px;
            max-width: 350px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #ef4444; }

        /* Profil sahifasi */
        .profile-header { text-align: center; padding: 20px 0; }
        .profile-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 16px; font-size: 32px; color: #fff; font-weight: 700;
        }
        .profile-name { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .profile-email { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .profile-info {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 16px; margin-bottom: 16px;
        }
        .profile-info p { color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .profile-info p span { color: #fff; font-weight: 600; }
        .logout-btn {
            width: 100%; background: rgba(239,68,68,0.15); color: #ef4444;
            border: 1px solid rgba(239,68,68,0.3); border-radius: 14px;
            padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s;
        }
        .logout-btn:hover { background: rgba(239,68,68,0.25); }

        /* SMS Kod yuborish tugmasi */
        .send-code-btn {
            background: rgba(139,92,246,0.15); color: #8b5cf6;
            border: 1px solid rgba(139,92,246,0.3); border-radius: 10px;
            padding: 8px 14px; font-size: 12px; font-weight: 600;
            cursor: pointer; white-space: nowrap; margin-left: 8px;
            transition: all 0.3s;
        }
        .send-code-btn:hover { background: rgba(139,92,246,0.25); }
        .send-code-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .code-row { display: flex; align-items: center; }
        .code-row .input-box { flex: 1; }

        .forgot-link { color: #8b5cf6; font-size: 13px; text-decoration: none; display: block; text-align: right; margin-top: -10px; margin-bottom: 16px; cursor: pointer; }
        .forgot-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="card" id="main-card">
        <!-- Logo -->
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>

        <h1 id="page-title">Ro'yxatdan O'tish</h1>
        <p class="subtitle" id="page-subtitle">Yangi hisob yaratish uchun formani to'ldiring</p>

        <!-- Tablar -->
        <div class="tabs" id="tabs-container">
            <button class="tab" id="btn-login" onclick="switchTab('login')">Kirish</button>
            <button class="tab active" id="btn-register" onclick="switchTab('register')">Ro'yxatdan o'tish</button>
        </div>

        <!-- RO'YXATDAN O'TISH -->
        <div id="register-content" class="tab-content active">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>To'liq Ismingiz</label>
                    <div class="input-box">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <input type="text" id="reg-name" placeholder="Ism Familiya" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Gmail Pochta</label>
                    <div class="input-box">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <input type="email" id="reg-email" placeholder="nomi@gmail.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Parol</label>
                    <div class="input-box">
                        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <input type="password" id="reg-pass" placeholder="••••••••" required>
                        <span class="toggle-pass" onclick="togglePassword('reg-pass', this)">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label>SMS Kod (6 xonalik)</label>
                    <div class="code-row">
                        <div class="input-box" style="flex:1;">
                            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"/></svg>
                            <input type="text" id="reg-code" placeholder="123456" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                        </div>
                        <button type="button" class="send-code-btn" id="send-code-btn" onclick="sendSMSCode()">Kod yuborish</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="register-submit">Davom Etish</button>
            </form>
        </div>

        <!-- KIRISH -->
        <div id="login-content" class="tab-content">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Gmail Pochta</label>
                    <div class="input-box">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <input type="email" id="login-email" placeholder="nomi@gmail.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Parol</label>
                    <div class="input-box">
                        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <input type="password" id="login-pass" placeholder="••••••••" required>
                        <span class="toggle-pass" onclick="togglePassword('login-pass', this)">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </span>
                    </div>
                </div>

                <a class="forgot-link" onclick="switchTab('forgot')">Parolni unutdingizmi?</a>

                <button type="submit" class="submit-btn">Kirish</button>
            </form>
        </div>

        <!-- PAROLNI TIKLASH -->
        <div id="forgot-content" class="tab-content">
            <form onsubmit="handleForgot(event)">
                <div class="form-group">
                    <label>Gmail Pochta</label>
                    <div class="input-box">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <input type="email" id="forgot-email" placeholder="nomi@gmail.com" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Tiklash havolasini yuborish</button>
                <a class="forgot-link" style="text-align:center; margin-top:15px;" onclick="switchTab('login')">Orqaga qaytish</a>
            </form>
        </div>

        <!-- PROFIL SAHIFASI -->
        <div id="profile-content" class="tab-content">
            <div class="profile-header">
                <div class="profile-avatar" id="profile-avatar">U</div>
                <div class="profile-name" id="profile-name">Foydalanuvchi</div>
                <div class="profile-email" id="profile-email">user@mail.com</div>
            </div>
            <div class="profile-info">
                <p>Holat <span style="color:#10b981;">✓ Faol</span></p>
                <p>Ro'yxatdan o'tgan sana <span id="profile-date">-</span></p>
                <p>Hisob turi <span>Standart</span></p>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Chiqish</button>
        </div>

        <!-- Ijtimoiy tarmoqlar (faqat auth sahifalarida ko'rinadi) -->
        <div id="socials-section">
            <div class="divider">yoki quyidagilar orqali</div>
            <div class="socials">
                <button type="button" class="social-btn" onclick="socialLogin('Google')">
                    <svg viewBox="0 0 24 24" fill="#4285F4"><path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/></svg>
                    Google
                </button>
                <button type="button" class="social-btn" onclick="socialLogin('Telegram')">
                    <svg viewBox="0 0 24 24" fill="#0088cc"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                    Telegram
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== MA'LUMOTLAR BAZASI (LocalStorage) ====================
        // Foydalanuvchilarni saqlash uchun oddiy ma'lumotlar bazasi
        function getUsers() {
            var users = localStorage.getItem('app_users');
            return users ? JSON.parse(users) : [];
        }
        function saveUsers(users) {
            localStorage.setItem('app_users', JSON.stringify(users));
        }
        function findUserByEmail(email) {
            return getUsers().find(u => u.email === email);
        }
        function getCurrentUser() {
            var email = localStorage.getItem('current_user');
            return email ? findUserByEmail(email) : null;
        }
        function setCurrentUser(email) {
            localStorage.setItem('current_user', email);
        }
        function clearCurrentUser() {
            localStorage.removeItem('current_user');
        }

        // ==================== SMS KOD TIZIMI ====================
        var generatedCode = null;
        var codeExpireTime = 0;
        var codeTimer = null;

        function generateCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function sendSMSCode() {
            var email = document.getElementById('reg-email').value;
            if (!email || !email.includes('@')) {
                showToast("Avval to'g'ri Gmail manzil kiriting!", "error");
                return;
            }

            generatedCode = generateCode();
            codeExpireTime = Date.now() + 120000; // 2 daqiqa

            var btn = document.getElementById('send-code-btn');
            btn.disabled = true;
            btn.innerText = "Yuborildi ✓";

            showToast("SMS kod yuborildi: " + generatedCode + " (2 daqiqa amal qiladi)", "success");

            // Timer boshlash
            var seconds = 120;
            codeTimer = setInterval(function() {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(codeTimer);
                    btn.disabled = false;
                    btn.innerText = "Qayta yuborish";
                    generatedCode = null;
                } else {
                    btn.innerText = "Qayta yuborish (" + seconds + "s)";
                }
            }, 1000);
        }

        // ==================== TAB ALMASHISH ====================
        function switchTab(type) {
            // Barcha tab va kontentlarni tozalash
            var tabBtns = ['btn-login', 'btn-register'];
            var contents = ['login-content', 'register-content', 'forgot-content', 'profile-content'];
            tabBtns.forEach(id => document.getElementById(id).classList.remove('active'));
            contents.forEach(id => document.getElementById(id).classList.remove('active'));

            var titles = {
                'register': ["Ro'yxatdan O'tish", "Yangi hisob yaratish uchun formani to'ldiring"],
                'login': ["Tizimga Kirish", "Hisobingizga kirish uchun ma'lumotlarni kiriting"],
                'forgot': ["Parolni Tiklash", "Gmail manzilingizni kiriting"],
                'profile': ["Profil", "Hisobingiz ma'lumotlari"]
            };

            if (type === 'login') {
                document.getElementById('btn-login').classList.add('active');
                document.getElementById('login-content').classList.add('active');
            } else if (type === 'register') {
                document.getElementById('btn-register').classList.add('active');
                document.getElementById('register-content').classList.add('active');
            } else if (type === 'forgot') {
                document.getElementById('forgot-content').classList.add('active');
            } else if (type === 'profile') {
                document.getElementById('profile-content').classList.add('active');
            }

            // Sarlavha va tab ko'rinishini boshqarish
            document.getElementById('page-title').innerText = titles[type][0];
            document.getElementById('page-subtitle').innerText = titles[type][1];

            var tabsContainer = document.getElementById('tabs-container');
            var socialsSection = document.getElementById('socials-section');

            if (type === 'profile') {
                tabsContainer.style.display = 'none';
                socialsSection.style.display = 'none';
            } else if (type === 'forgot') {
                tabsContainer.style.display = 'none';
                socialsSection.style.display = 'flex';
            } else {
                tabsContainer.style.display = 'flex';
                socialsSection.style.display = 'block';
            }
        }

        // ==================== PAROLNI KO'RISH ====================
        function togglePassword(inputId, iconElement) {
            var input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.querySelector('svg').style.fill = "#8b5cf6";
                iconElement.style.opacity = "1";
            } else {
                input.type = "password";
                iconElement.querySelector('svg').style.fill = "#64748b";
                iconElement.style.opacity = "0.7";
            }
        }

        // ==================== XABAR (TOAST) ====================
        function showToast(message, type = 'success') {
            var toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = 'toast show ' + type;
            setTimeout(function() { toast.classList.remove('show'); }, 4000);
        }

        // ==================== RO'YXATDAN O'TISH ====================
        function handleRegister(event) {
            event.preventDefault();
            var name = document.getElementById('reg-name').value.trim();
            var email = document.getElementById('reg-email').value.trim();
            var pass = document.getElementById('reg-pass').value;
            var code = document.getElementById('reg-code').value.trim();

            // Tekshiruvlar
            if (name.length < 3) {
                showToast("Ism kamida 3 ta harfdan iborat bo'lishi kerak!", "error");
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showToast("Gmail manzil noto'g'ri formatda!", "error");
                return;
            }
            if (findUserByEmail(email)) {
                showToast("Bu email allaqachon ro'yxatdan o'tgan!", "error");
                return;
            }
            if (pass.length < 6) {
                showToast("Parol kamida 6 ta belgidan iborat bo'lishi kerak!", "error");
                return;
            }
            if (!generatedCode) {
                showToast("Avval SMS kod yuboring!", "error");
                return;
            }
            if (Date.now() > codeExpireTime) {
                showToast("SMS kod muddati tugagan! Qayta yuboring.", "error");
                return;
            }
            if (code !== generatedCode) {
                showToast("SMS kod noto'g'ri!", "error");
                return;
            }

            // Foydalanuvchini saqlash
            var users = getUsers();
            users.push({
                name: name,
                email: email,
                password: pass,
                date: new Date().toLocaleDateString('uz-UZ'),
                createdAt: Date.now()
            });
            saveUsers(users);

            // Avtomatik kirish
            setCurrentUser(email);
            generatedCode = null;
            if (codeTimer) clearInterval(codeTimer);

            showToast("Muvaffaqiyatli ro'yxatdan o'tdingiz, " + name + "!", "success");

            // Formani tozalash
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-pass').value = '';
            document.getElementById('reg-code').value = '';
            document.getElementById('send-code-btn').disabled = false;
            document.getElementById('send-code-btn').innerText = "Kod yuborish";

            // Profilga o'tish
            setTimeout(function() { showProfile(); }, 800);
        }

        // ==================== KIRISH ====================
        function handleLogin(event) {
            event.preventDefault();
            var email = document.getElementById('login-email').value.trim();
            var pass = document.getElementById('login-pass').value;

            var user = findUserByEmail(email);
            if (!user) {
                showToast("Bunday email topilmadi! Ro'yxatdan o'ting.", "error");
                return;
            }
            if (user.password !== pass) {
                showToast("Parol noto'g'ri!", "error");
                return;
            }

            setCurrentUser(email);
            showToast("Xush kelibsiz, " + user.name + "!", "success");
            document.getElementById('login-email').value = '';
            document.getElementById('login-pass').value = '';

            setTimeout(function() { showProfile(); }, 800);
        }

        // ==================== PAROLNI TIKLASH ====================
        function handleForgot(event) {
            event.preventDefault();
            var email = document.getElementById('forgot-email').value.trim();
            var user = findUserByEmail(email);

            if (!user) {
                showToast("Bunday email topilmadi!", "error");
                return;
            }

            showToast("Tiklash havolasi " + email + " ga yuborildi! (Simulyatsiya)", "success");
            document.getElementById('forgot-email').value = '';

            setTimeout(function() { switchTab('login'); }, 1500);
        }

        // ==================== PROFILNI KO'RSATISH ====================
        function showProfile() {
            var user = getCurrentUser();
            if (!user) { switchTab('login'); return; }

            document.getElementById('profile-avatar').innerText = user.name.charAt(0).toUpperCase();
            document.getElementById('profile-name').innerText = user.name;
            document.getElementById('profile-email').innerText = user.email;
            document.getElementById('profile-date').innerText = user.date;

            switchTab('profile');
        }

        // ==================== CHIQISH ====================
        function handleLogout() {
            clearCurrentUser();
            showToast("Tizimdan chiqdingiz!", "success");
            setTimeout(function() { switchTab('login'); }, 500);
        }

        // ==================== IJTIMOIY TARMOQLAR ====================
        function socialLogin(provider) {
            showToast(provider + " orqali kirish oynasi ochilmoqda... (Simulyatsiya)", "success");

            // Simulyatsiya: 1.5 sekunddan keyin avtomatik kirish
            setTimeout(function() {
                var demoEmail = "demo." + provider.toLowerCase() + "@gmail.com";
                var users = getUsers();
                var existing = findUserByEmail(demoEmail);

                if (!existing) {
                    users.push({
                        name: provider + " Foydalanuvchi",
                        email: demoEmail,
                        password: "demo123",
                        date: new Date().toLocaleDateString('uz-UZ'),
                        createdAt: Date.now()
                    });
                    saveUsers(users);
                }

                setCurrentUser(demoEmail);
                showToast(provider + " orqali muvaffaqiyatli kirdingiz!", "success");
                setTimeout(function() { showProfile(); }, 500);
            }, 1500);
        }

        // ==================== SAHIFA YUKLANGANDA ====================
        window.onload = function() {
            // Agar foydalanuvchi allaqachon kirgan bo'lsa, profilni ko'rsatish
            var user = getCurrentUser();
            if (user) {
                showProfile();
            } else {
                switchTab('register');
            }
        };
    </script>
</body>
</html>
