<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan O'tish</title>
    <style>
        /* Asosiy sozlamalar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1219; /* Orqa fon rangi */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Asosiy karta */
        .register-card {
            background-color: #1a1f2b;
            border: 1px solid #2a3142;
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Logo */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        /* Sarlavha */
        .title {
            color: #ffffff;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Tab tugmalari (Kirish / Ro'yxatdan o'tish) */
        .tabs {
            display: flex;
            background-color: #11151c;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            color: #9ca3af;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, #06b6d4, #8b5cf6);
            color: #ffffff;
        }

        /* Form elementlari */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #d1d5db;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 16px;
        }

        .input-field {
            width: 100%;
            background-color: #1f2533;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 14px 14px 14px 45px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-field::placeholder {
            color: #6b7280;
        }

        .input-field:focus {
            border-color: #3b82f6;
        }

        /* Parol ko'z belgisi */
        .password-toggle {
            position: absolute;
            right: 14px;
            cursor: pointer;
            font-size: 16px;
            color: #9ca3af;
        }

        /* Asosiy tugma */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* "yoki quyidagilar orqali" qismi */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin: 24px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #374151;
        }

        .divider::before {
            margin-right: 15px;
        }

        .divider::after {
            margin-left: 15px;
        }

        /* Ijtimoiy tarmoq tugmalari */
        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background-color: #1f2533;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .social-btn:hover {
            background-color: #2a3142;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo">⚡</div>
        </div>

        <!-- Sarlavha -->
        <h1 class="title">Ro'yxatdan O'tish</h1>
        <p class="subtitle">Yangi hisob yaratish uchun formani to'ldiring</p>

        <!-- Tablar -->
        <div class="tabs">
            <button class="tab-btn">Kirish</button>
            <button class="tab-btn active">Ro'yxatdan o'tish</button>
        </div>

        <!-- Forma -->
        <form>
            <!-- Ism Familiya -->
            <div class="form-group">
                <label>TO'LIQ ISMINGIZ</label>
                <div class="input-wrapper">
                    <span class="input-icon">📝</span>
                    <input type="text" class="input-field" placeholder="Ism Familiya">
                </div>
            </div>

            <!-- Gmail -->
            <div class="form-group">
                <label>GMAIL POCHTA</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input type="email" class="input-field" placeholder="nomi@gmail.com">
                </div>
            </div>

            <!-- Parol -->
            <div class="form-group">
                <label>PAROL</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input type="password" class="input-field" placeholder="••••••••">
                    <span class="password-toggle">👁️</span>
                </div>
            </div>

            <!-- SMS Kod -->
            <div class="form-group">
                <label>GMAIL'GA YUBORILGAN 6 XONALIK SMS KOD</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔢</span>
                    <input type="text" class="input-field" placeholder="123456">
                </div>
            </div>

            <!-- Asosiy tugma -->
            <button type="button" class="submit-btn">Davom Etish (Captcha)</button>
        </form>

        <!-- Ijtimoiy tarmoqlar -->
        <div class="divider">yoki quyidagilar orqali</div>
        
        <div class="social-buttons">
            <button class="social-btn">
                🌐 Google
            </button>
            <button class="social-btn">
                ✈️ Telegram
            </button>
        </div>
    </div>

</body>
</html>
