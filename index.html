<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usta Makon</title>
<style>
:root{--ink:#0f2a3d;--bg:#eaf6f6;--card:#fff;--line:#d3e6e6;--teal:#0fb5a6;--blue:#2563eb;--muted:#587184;--ok:#0b8a5a}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--ink:#2b1d14;--bg:#fff4ea;--card:#fff;--line:#f0d9c4;--teal:#f59e0b;--blue:#ea580c;--muted:#7a6554;--ok:#0b8a5a}
header{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;padding:26px 18px 58px;border-radius:0 0 30px 30px}
header h1{margin:0;font-size:30px;font-weight:800}
header p{margin:6px 0 0;font-size:15px;opacity:.92}
header{background:linear-gradient(120deg,var(--teal),var(--blue));color:#fff;padding:30px 18px 64px;border-radius:0 0 50% 50%/0 0 36px 36px}
.out{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
main{max-width:640px;margin:-34px auto 0;padding:0 14px 40px}
.panel{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 8px 24px rgba(15,42,61,.12);margin-bottom:14px}
.panel h2{margin:0 0 4px;font-size:22px}
.role{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px;margin-top:12px;font:inherit;cursor:pointer;color:var(--ink)}
.role b{font-size:18px}
.role span{color:var(--muted);font-size:14px}
.role{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:2px solid var(--line);border-left:6px solid var(--teal);background:#fff;border-radius:14px;padding:16px;margin-top:12px;font:inherit;cursor:pointer;color:var(--ink)}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;padding:14px 0 0;cursor:pointer}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#f3fafa;border:2px solid transparent;border-radius:14px;padding:13px 14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
.err{color:#c0392b;font-size:14px;min-height:20px;margin:8px 0 0}
.search{background:var(--card);border-radius:20px;padding:12px;box-shadow:0 8px 24px rgba(15,42,61,.12)}
.row{margin-top:8px}
.note{background:#d9f5e8;color:var(--ok);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px}
.chip{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(15,42,61,.08)}
.chip[aria-pressed=true]{background:var(--teal);color:#fff}
.count{margin:10px 4px;color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(15,42,61,.08)}
.top{display:flex;align-items:center;gap:12px}
.ava{flex:none;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.who{flex:1;min-width:0}
.name{font-weight:700;font-size:18px;margin:0}
.job{color:var(--teal);font-weight:600;font-size:15px;margin:1px 0 0}
.rate{font-weight:700;white-space:nowrap;background:#fff6d6;color:#7a5a00;border-radius:999px;padding:5px 10px;font-size:14px}
.rate.new{background:#d9f5e8;color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tag{background:#eef6f6;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:13px}
.about{margin:0 0 14px;font-size:15px}
.btns{display:flex;gap:10px}
.btn{flex:1;text-align:center;text-decoration:none;font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px;cursor:pointer}
.call{background:linear-gradient(135deg,var(--teal),#0a9a8d);color:#fff}
.tg{background:#e4edff;color:var(--blue)}
.mine{background:#d9f5e8;color:var(--ok);border-radius:14px;padding:11px;text-align:center;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
</style>
</head>
<body>

<section id="auth">
  <header>
    <h1>Usta Makon</h1>
    <p>Ustalar va mijozlarni bogʻlaydigan ilova · v2</p>
  </header>
  <main>
    <div class="panel" id="stepRole">
      <h2>Kim sifatida kirasiz?</h2>
      <button class="role" type="button" data-mode="mijoz"><b>Men mijozman</b><span>Kerakli ustani qidiraman</span></button>
      <button class="role" type="button" data-mode="usta"><b>Men ustaman</b><span>Mijozlar meni topsin</span></button>
      <button class="link" type="button" data-mode="kirish">Akkauntim bor, kirish</button>
    </div>

    <div class="panel" id="stepForm" hidden>
      <button class="link" type="button" id="back" style="padding:0 0 10px">‹ Orqaga</button>
      <h2 id="formTitle"></h2>
      <div id="nameBox">
        <label for="fName">Ism</label>
        <input id="fName" autocomplete="name">
      </div>
      <label for="fPhone">Telefon raqam</label>
      <input id="fPhone" type="tel" placeholder="+998 90 123 45 67" autocomplete="tel">
      <div id="ustaBox">
        <label for="fJob">Kasb</label>
        <select id="fJob"></select>
        <label for="fRegion">Hudud</label>
        <select id="fRegion"></select>
        <label for="fTg">Telegram (ixtiyoriy)</label>
        <input id="fTg" placeholder="@foydalanuvchi">
        <label for="fPrice">Narx (masalan: 100 000 soʻmdan)</label>
        <input id="fPrice">
        <label for="fExp">Tajriba (yil)</label>
        <input id="fExp" type="number" min="0" max="60">
        <label for="fAbout">Oʻzingiz haqingizda</label>
        <textarea id="fAbout" rows="3"></textarea>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn call" type="button" id="submit" style="width:100%;margin-top:6px"></button>
    </div>
  </main>
</section>

<section id="app" hidden>
  <header>
    <div class="bar">
      <div>
        <h1>Usta Makon</h1>
        <p id="hello"></p>
      </div>
      <button class="out" type="button" id="logout">Chiqish</button>
    </div>
  </header>
  <main>
    <div class="search">
      <input id="q" type="search" placeholder="Ism yoki ish turi boʻyicha qidiring" aria-label="Qidiruv">
      <div class="row"><select id="region" aria-label="Hudud"></select></div>
    </div>
    <div class="note" id="note" hidden>Siz usta sifatida roʻyxatdan oʻtgansiz. Profilingiz mijozlarga koʻrinadi.</div>
    <div class="chips" id="chips" role="group" aria-label="Kasb"></div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </main>
</section>

<script>
var JOBS = ["Elektrik","Santexnik","Quruvchi","Duradgor","Plitka ustasi","Pardozchi","Konditsioner ustasi","Maishiy texnika"];
var REGIONS = ["Toshkent","Samarqand","Buxoro","Andijon","Fargʻona","Namangan","Qashqadaryo","Xorazm"];
var SEED = [
 {name:"Aziz Karimov",job:"Elektrik",region:"Toshkent",phone:"+998901112233",tg:"",price:"80 000 soʻmdan",exp:9,rating:4.8,about:"Simlarni almashtirish, rozetka va shitlar, yoritish."},
 {name:"Bobur Rahmonov",job:"Santexnik",region:"Samarqand",phone:"+998933334455",tg:"",price:"100 000 soʻmdan",exp:6,rating:4.6,about:"Quvur, kran, unitaz va isitish tizimlari."},
 {name:"Dilshod Yoʻldoshev",job:"Plitka ustasi",region:"Toshkent",phone:"+998975556677",tg:"",price:"45 000 soʻm/m²",exp:12,rating:4.9,about:"Hammom va oshxona plitkasi, aniq va tekis."},
 {name:"Sardor Tursunov",job:"Duradgor",region:"Andijon",phone:"+998887778899",tg:"",price:"Kelishilgan holda",exp:15,rating:4.7,about:"Eshik, shkaf va mebel yasash hamda taʼmirlash."},
 {name:"Jasur Ergashev",job:"Konditsioner ustasi",region:"Buxoro",phone:"+998901239876",tg:"",price:"120 000 soʻmdan",exp:5,rating:4.5,about:"Oʻrnatish, tozalash va gaz toʻldirish."}
];
var UK = "um_users", MK = "um_me";
var state = {q:"", region:"Barcha hudud", job:"Hammasi"};
var formMode = "mijoz";
var me = null;

function $(id){return document.getElementById(id);}
function esc(t){
  return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
}
function fillSelect(el, items){
  el.innerHTML = items.map(function(x){return "<option>"+esc(x)+"</option>";}).join("");
}
function norm(p){
  var d = String(p).replace(/\D/g,"");
  if(d.length===9) d = "998"+d;
  return d;
}
function getUsers(){
  try{ return JSON.parse(localStorage.getItem(UK)) || []; }catch(e){ return []; }
}
function saveUsers(u){
  try{ localStorage.setItem(UK, JSON.stringify(u)); }catch(e){}
}
function setMe(d){
  try{ localStorage.setItem(MK, d); }catch(e){}
}
function currentUser(){
  var d = "";
  try{ d = localStorage.getItem(MK) || ""; }catch(e){}
  if(!d) return null;
  return getUsers().find(function(u){return norm(u.phone)===d;}) || null;
}
function allMasters(){
  var mine = getUsers().filter(function(u){return u.role==="usta";}).reverse();
  return mine.concat(SEED);
}

/* Kirish / roʻyxatdan oʻtish */
function showAuth(){
  $("app").hidden = true; $("auth").hidden = false;
  $("stepRole").hidden = false; $("stepForm").hidden = true;
  window.scrollTo(0,0);
}
function openForm(mode){
  formMode = mode;
  $("formTitle").textContent = mode==="usta" ? "Usta sifatida roʻyxatdan oʻtish" : mode==="mijoz" ? "Mijoz sifatida roʻyxatdan oʻtish" : "Kirish";
  $("submit").textContent = mode==="kirish" ? "Kirish" : "Roʻyxatdan oʻtish";
  $("nameBox").hidden = mode==="kirish";
  $("ustaBox").hidden = mode!=="usta";
  $("err").textContent = "";
  $("stepRole").hidden = true; $("stepForm").hidden = false;
}
function submitForm(){
  var d = norm($("fPhone").value);
  var users = getUsers();
  var found = users.find(function(u){return norm(u.phone)===d;});
  if(d.length!==12){ $("err").textContent = "Telefon raqamni toʻliq kiriting: +998 90 123 45 67"; return; }

  if(formMode==="kirish"){
    if(!found){ $("err").textContent = "Bu raqam topilmadi. Avval roʻyxatdan oʻting."; return; }
    setMe(d); showApp(); return;
  }
  var name = $("fName").value.trim();
  if(name.length<2){ $("err").textContent = "Ismingizni kiriting."; return; }
  if(found){ $("err").textContent = "Bu raqam roʻyxatdan oʻtgan. Orqaga qaytib, Kirish ni tanlang."; return; }

  var u = {role:formMode, name:name, phone:"+"+d};
  if(formMode==="usta"){
    u.job = $("fJob").value;
    u.region = $("fRegion").value;
    u.tg = $("fTg").value.trim();
    u.price = $("fPrice").value.trim() || "Kelishilgan holda";
    u.exp = Number($("fExp").value) || 0;
    u.rating = 0;
    u.about = $("fAbout").value.trim() || "Maʼlumot kiritilmagan.";
  }
  users.push(u); saveUsers(users); setMe(d);
  ["fName","fPhone","fTg","fPrice","fExp","fAbout"].forEach(function(id){$(id).value="";});
  showApp();
}

/* Asosiy ekran */
function showApp(){
  me = currentUser();
  if(!me){ showAuth(); return; }
  $("auth").hidden = true; $("app").hidden = false;
  $("hello").textContent = "Salom, "+me.name.split(" ")[0]+" · "+(me.role==="usta" ? "usta" : "mijoz");
  $("note").hidden = me.role!=="usta";
  state = {q:"", region:"Barcha hudud", job:"Hammasi"};
  $("q").value = ""; $("region").value = "Barcha hudud";
  renderChips(); render();
  window.scrollTo(0,0);
}
function renderChips(){
  var all = ["Hammasi"].concat(JOBS);
  $("chips").innerHTML = all.map(function(j){
    return '<button type="button" class="chip" data-job="'+esc(j)+'" aria-pressed="'+(state.job===j)+'">'+esc(j)+'</button>';
  }).join("");
}
function render(){
  var q = state.q.trim().toLowerCase();
  var res = allMasters().filter(function(m){
    if(state.job!=="Hammasi" && m.job!==state.job) return false;
    if(state.region!=="Barcha hudud" && m.region!==state.region) return false;
    if(q && (m.name+" "+m.job+" "+m.about).toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
  $("count").textContent = res.length ? res.length+" ta usta topildi" : "";
  if(!res.length){
    $("list").innerHTML = '<div class="empty">Hech narsa topilmadi. Boshqa kasb yoki hududni tanlab koʻring.</div>';
    return;
  }
  $("list").innerHTML = res.map(function(m){
    var own = me && norm(m.phone)===norm(me.phone);
    var tg = m.tg ? '<a class="btn tg" target="_blank" rel="noopener" href="https://t.me/'+esc(m.tg.replace("@",""))+'">Telegram</a>' : "";
    var rate = m.rating ? '<span class="rate">★ '+m.rating.toFixed(1)+'</span>' : '<span class="rate new">Yangi</span>';
    var actions = own ? '<div class="mine">Bu sizning profilingiz</div>'
      : '<div class="btns"><a class="btn call" href="tel:'+esc(m.phone)+'">Qoʻngʻiroq qilish</a>'+tg+'</div>';
    return '<article class="card"><div class="top"><div class="ava">'+esc(m.name.charAt(0).toUpperCase())+'</div>'+
      '<div class="who"><h3 class="name">'+esc(m.name)+'</h3><p class="job">'+esc(m.job)+'</p></div>'+rate+'</div>'+
      '<div class="meta"><span class="tag">'+esc(m.region)+'</span><span class="tag">'+esc(m.exp)+' yil tajriba</span><span class="tag">'+esc(m.price)+'</span></div>'+
      '<p class="about">'+esc(m.about)+'</p>'+actions+'</article>';
  }).join("");
}

function init(){
  fillSelect($("region"), ["Barcha hudud"].concat(REGIONS));
  fillSelect($("fJob"), JOBS);
  fillSelect($("fRegion"), REGIONS);

  document.querySelectorAll("[data-mode]").forEach(function(b){
    b.addEventListener("click", function(){ openForm(b.getAttribute("data-mode")); });
  });
  $("back").addEventListener("click", showAuth);
  $("submit").addEventListener("click", submitForm);
  $("logout").addEventListener("click", function(){
    try{ localStorage.removeItem(MK); }catch(e){}
    me = null; showAuth();
  });

  $("q").addEventListener("input", function(e){state.q = e.target.value; render();});
  $("region").addEventListener("change", function(e){state.region = e.target.value; render();});
  $("chips").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    state.job = b.getAttribute("data-job"); renderChips(); render();
  });

  if(currentUser()) showApp(); else showAuth();
}
init();
</script>
</body>
</html>
